[project]
name = "pbg-autopoiesis"
version = "0.1.0"
description = "A whole-cell model built as a precarious, self-bounding network via composition of existing parts."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "process-bigraph",
    "bigraph-schema",
    "numpy",
    # The composites/processes build via core.build_core(), which imports the
    # reusable Intervention process; the dashboard publish + report jobs need it.
    # Declared BARE + git URL via [tool.uv.sources] below — NOT an inline
    # `pkg @ git+…` direct reference. A baked-in URL lands in this package's
    # metadata and uv then refuses to unify it with the bare `viva-superpowers`
    # requirement that vivarium-workbench (pulled by `dev`) declares → the
    # "conflicting URLs for viva-superpowers" resolve failure. Same pattern the
    # other dashboards (e.g. v2ecoli) use for their superpowers dep.
    "viva-superpowers",
    # loop.py's external_membrane / injected_node hooks use the framework's
    # reusable Intervention process (register_intervention / intervention_node).
    "pbg-basic-processes",
]

[project.optional-dependencies]
test = ["pytest"]
# `dev` carries the dashboard so `uv sync --extra dev` (the publish CI step)
# provides the static-bundle builder + headless report server.
dev = [
    "vivarium-workbench @ git+https://github.com/vivarium-collective/vivarium-dashboard.git@main",
    "matplotlib",
]

[tool.uv.sources]
# Pin the SAME rev vivarium-workbench pins (it bakes viva-superpowers@<rev> into
# its published metadata), so uv unifies the two into one URL instead of failing
# with "conflicting URLs for viva-superpowers". Bump in lockstep with the
# workbench when it moves the rev.
viva-superpowers = { git = "https://github.com/vivarium-collective/viva-superpowers.git", rev = "1dd4adc43fbcd5a7dfaf80b4e5dee070f0abeeca" }
pbg-basic-processes = { git = "https://github.com/vivarium-collective/pbg-basic-processes.git", branch = "main" }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

# Allow the git-direct-reference deps above (pbg-superpowers / vivarium-workbench
# @ git+https://…) — hatchling rejects them otherwise.
[tool.hatch.metadata]
allow-direct-references = true

[tool.hatch.build.targets.wheel]
packages = ["pbg_autopoiesis"]
