[project]
name = "pbg-autopoiesis"
version = "0.1.0"
description = "A whole-cell model built as a precarious, self-bounding network via composition of existing parts."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "process-bigraph",
    "bigraph-schema",
    "numpy",
    # The composites/processes build via core.build_core(), which imports the
    # reusable Intervention process; the dashboard publish + report jobs need it.
    "viva-superpowers @ git+https://github.com/vivarium-collective/viva-superpowers.git@main",
    # loop.py's external_membrane / injected_node hooks use the framework's
    # reusable Intervention process (register_intervention / intervention_node).
    "pbg-basic-processes",
]

[project.optional-dependencies]
test = ["pytest"]
# `dev` carries the dashboard so `uv sync --extra dev` (the publish CI step)
# provides the static-bundle builder + headless report server.
dev = [
    "vivarium-workbench @ git+https://github.com/vivarium-collective/vivarium-dashboard.git@main",
    "matplotlib",
]

[tool.uv.sources]
pbg-basic-processes = { git = "https://github.com/vivarium-collective/pbg-basic-processes.git", branch = "main" }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

# Allow the git-direct-reference deps above (pbg-superpowers / vivarium-workbench
# @ git+https://…) — hatchling rejects them otherwise.
[tool.hatch.metadata]
allow-direct-references = true

[tool.hatch.build.targets.wheel]
packages = ["pbg_autopoiesis"]
